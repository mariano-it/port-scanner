[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portscan"
version = "0.1.0"
description = "Port scanner didáctico (TCP connect + banners) con alcance obligatorio, auditoría y detector purple team."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
portscan = "portscan.cli:main"
portscan-detect = "portscan.detect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
